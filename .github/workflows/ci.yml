name: CI

on:
  push:
    branches: [main, feature/dynamic-input]
  pull_request:

permissions:
  contents: read
  issues: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Compile production sources
        run: python -m compileall -q src
      - name: Run design fail-closed certification tests
        run: pytest -q tests/project_production/test_design_production_core.py
      - name: Run test suite
        shell: bash
        run: |
          set +e
          pytest -q --tb=short 2>&1 | tee pytest-full.log
          status=${PIPESTATUS[0]}
          tail -n 240 pytest-full.log > pytest-failure-tail.txt
          exit "$status"
      - name: Publish pytest failure diagnostics
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'pytest-failure-tail.txt';
            const tail = fs.existsSync(path)
              ? fs.readFileSync(path, 'utf8')
              : 'pytest-failure-tail.txt was not produced.';
            const body = [
              '<!-- aias-ci-pytest-diagnostics -->',
              '### CI pytest failure diagnostics',
              '',
              '```text',
              tail,
              '```'
            ].join('\n').slice(0, 65000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
