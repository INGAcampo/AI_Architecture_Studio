name: CI

on:
  push:
    branches: [main, feature/dynamic-input]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install pytest
      - name: Compile production sources
        run: python -m compileall -q src
      - name: Run design fail-closed certification tests
        run: pytest -q tests/project_production/test_design_production_core.py
      - name: Run test suite
        run: pytest -q
